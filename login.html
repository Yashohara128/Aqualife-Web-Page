<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqualife Water Filter Suppliers - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="d-flex align-items-center justify-content-center"> 

    <!-- 🌐 Top Bar: Admin Portal & Language Switcher -->
    <div class="lang-selector-top d-flex align-items-center gap-2">
        <!-- 🔑 Admin Portal Button (Opens Admin Modal) -->
        <button type="button" class="btn btn-sm btn-warning text-dark fw-bold rounded-pill shadow-sm px-3" data-bs-toggle="modal" data-bs-target="#adminLoginModal">
            <i class="fa-solid fa-user-shield me-1"></i> Admin Portal
        </button>

        <!-- Language Buttons -->
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-sm btn-light active" id="btn-en">EN</button>
            <button type="button" class="btn btn-sm btn-light" id="btn-si">සිංහල</button>
        </div>
    </div>

    <!-- 📦 Main Container -->
    <div class="login-container text-center">
        
        <!-- Logo -->
        <div class="logo-wrapper mx-auto mb-4">
            <img src="Aqualife logo.jpeg" alt="Aqualife Logo" class="logo-img">
        </div>

        <div id="authBox">
            
            <!-- 1️⃣ CUSTOMER LOGIN SECTION -->
            <div id="loginSection">
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg text-center" id="username" name="username_email" placeholder="User Name / Email" required>
                    </div>
                    
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg text-center" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div id="loginAlert" class="alert alert-danger py-2 small d-none mb-3"></div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 fw-bold" id="btn-login" data-i18n="btn_login">Loging</button>
                </form>

                <button type="button" class="btn btn-custom-gray w-100 mb-2 fw-semibold" id="btn-create" data-i18n="btn_create">
                    Create a new account
                </button>

                <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none mt-2 text-secondary" id="btn-forgot-link" data-i18n="btn_forgot">
                    Forget user password
                </button>
            </div>

            <!-- 2️⃣ SIGNUP SECTION -->
            <div id="signupSection" class="d-none text-start mt-3">
                <h5 class="fw-bold text-center mb-3 text-dark" id="txt-signup-title">Create New Account</h5>
                <form id="signupForm">
                    <div class="mb-2">
                        <input type="text" class="form-control form-control-lg text-center" id="regUser" placeholder="Enter User Name" required>
                    </div>
                    <div class="mb-2">
                        <input type="email" class="form-control form-control-lg text-center" id="regGmail" placeholder="Enter valid Gmail address" required>
                    </div>
                    <div class="mb-2">
                        <input type="password" class="form-control form-control-lg text-center" id="regPass" placeholder="Enter password" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg text-center" id="regConfirmPass" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 mb-2 fw-bold" id="btn-register-submit">Register</button>
                    <button type="button" class="btn btn-link btn-sm w-100 text-center text-decoration-none text-secondary" id="btn-signup-back" data-i18n="btn_back">Back to Login</button>
                </form>
            </div>

            <!-- 3️⃣ FORGOT PASSWORD SECTION -->
            <div id="forgotSection" class="d-none mt-3">
                <h5 class="fw-bold text-dark mb-3" id="txt-forgot-title">Reset Password</h5>
                <p class="text-muted small mb-3" id="txt-forgot-desc">Enter your registered email address to receive an OTP code.</p>
                <form id="forgotForm">
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-lg text-center" id="forgotEmail" placeholder="Enter your registered Gmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-2 fw-bold" id="btn-send-code">Send OTP Code</button>
                    <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none text-secondary" id="btn-forgot-back" data-i18n="btn_back">Back to Login</button>
                </form>
            </div>

            <!-- 4️⃣ OTP VERIFICATION SECTION -->
            <div id="otpSection" class="d-none mt-3">
                <h5 class="fw-bold text-dark mb-3" id="txt-otp-title">Enter OTP Code</h5>
                <p class="text-muted small mb-3" id="txt-otp-desc">We have generated OTP for your email. Check your alerts!</p>
                <form id="otpForm">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg text-center fw-bold letter-spacing-2" id="otpInput" placeholder="Enter 4-Digit OTP" maxlength="4" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-2 fw-bold" id="btn-verify-otp">Verify & Show Password</button>
                    <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none text-secondary" id="btn-otp-back" data-i18n="btn_back">Back to Login</button>
                </form>
            </div>

        </div>
    </div>

    <!-- 🔒 ADMIN LOGIN MODAL POPUP -->
    <div class="modal fade" id="adminLoginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-dark text-white border-0 py-3">
                    <h6 class="modal-title fw-bold">
                        <i class="fa-solid fa-user-shield text-warning me-2"></i>Admin Authentication
                    </h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <form id="adminForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" name="admin_username" id="adminUser" class="form-control" placeholder="Enter Admin Username" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-key text-muted"></i></span>
                                <input type="password" name="admin_password" id="adminPass" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div id="adminAlert" class="alert alert-danger py-2 small d-none text-center"></div>

                        <button type="submit" class="btn btn-warning text-dark w-100 rounded-pill fw-bold py-2 shadow-sm">
                            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Enter Dashboard
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form Switchers
        document.getElementById('btn-create').addEventListener('click', () => {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('signupSection').classList.remove('d-none');
        });
        document.getElementById('btn-signup-back').addEventListener('click', () => {
            document.getElementById('signupSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        });
        document.getElementById('btn-forgot-link').addEventListener('click', () => {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('forgotSection').classList.remove('d-none');
        });
        document.getElementById('btn-forgot-back').addEventListener('click', () => {
            document.getElementById('forgotSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        });

        // 👤 Normal User Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const alertBox = document.getElementById('loginAlert');

            fetch('process_login.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = data.redirect;
                } else {
                    alertBox.textContent = data.message;
                    alertBox.classList.remove('d-none');
                }
            })
            .catch(err => console.error(err));
        });

        // 🔑 Admin Portal Login Submission
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const adminAlert = document.getElementById('adminAlert');

            fetch('process_admin_login.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    adminAlert.classList.add('d-none');
                    window.location.href = data.redirect;
                } else {
                    adminAlert.textContent = data.message;
                    adminAlert.classList.remove('d-none');
                }
            })
            .catch(err => {
                console.error(err);
                adminAlert.textContent = "Server error!";
                adminAlert.classList.remove('d-none');
            });
        });
    </script>
</body>
</html>
